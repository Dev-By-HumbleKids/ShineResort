<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHINE — Luxury Beach Resort · Ngwe Saung, Myanmar</title>
    <meta
      name="description"
      content="SHINE is a fictional five-star beachfront resort in Ngwe Saung, Myanmar — oceanfront villas, island excursions, beach horse riding, spa and fine dining. A frontend portfolio project."
    />
    <meta name="author" content="KoonSett (Win Thant Aung)" />
    <meta name="theme-color" content="#102C35" />
    <meta property="og:title" content="SHINE — Where the Ocean Meets Extraordinary" />
    <meta property="og:description" content="Stay by the sea. Discover beyond the shore. A fictional luxury resort experience built as a frontend portfolio project." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1600011689032-8b628b8a8747?auto=format&fit=crop&w=1200&h=630&q=75" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('shine.theme')
        if (t === 'night' || t === 'day') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
